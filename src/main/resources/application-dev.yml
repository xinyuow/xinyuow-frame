# ***************** 测试环境的配置信息 ***************** #
server:
  port: 8080


# ***************** 测试环境的 Spring 配置信息 ***************** #
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    druid:
      db-type: mysql
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
      username: ${MYSQL_USERNAME}
      password: ${MYSQL_PASSWORD}
      # 连接池：初始化连接数
      initial-size: 10
      # 连接池：最小空闲连接数
      min-idle: 5
      # 连接池：最大活跃连接数
      max-active: 100
      # 连接池：获取连接等待超时时间
      max-wait: 60000
      # 间隔多久进行一次检测
      time-between-eviction-runs-millis: 60000
      # 一个连接在池中最小生存时间
      min-evictable-idle-time-millis: 300000
      # 检测连接是否有效的 SQL
      validation-query: SELECT 1 FROM DUAL
      # 申请连接时检测空闲连接
      test-while-idle: true
      # 申请连接时不检测
      test-on-borrow: false
      # 归还连接时不检测
      test-on-return: false
      # MySQL 下关闭 PSCache
      pool-prepared-statements: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 0
      # Redis操作的超时时间
      timeout: 5s


# ***************** 测试环境的 MyBatis-Plus 配置信息 ***************** #
mybatis-plus:
  configuration:
    # 开发环境输出 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


# ***************** 测试环境的业务配置信息 ***************** #
xinyuow:
  swagger:
    enable: true
    username: ${SWAGGER_USERNAME}
    password: ${SWAGGER_PASSWORD}
    role: ${SWAGGER_ROLE}