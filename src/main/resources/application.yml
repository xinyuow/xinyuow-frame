# ***************** spring配置 开始 ******************************** #
spring:
  application:
    name: xinyuow-frame
  profiles:
    # 指定项目启动时的配置文件
    active: dev
  web:
    resources:
      # 不要为工程中的资源文件建立默认映射
      add-mappings: false
  flyway:
    enabled: true
    # 禁止 clean 操作
    clean-disabled: true
    # Flyway 历史记录表名
    table: Z_FRAME_SCHEMA_HISTORY
  servlet:
    multipart:
      # 上传文件最大大小
      max-file-size: 5MB
      # 上传文件总大小
      max-request-size: 5MB


# Logback配置
logging:
  config: classpath:logback-spring.xml


# Mybatis-Plus配置
mybatis-plus:
  # 启动时检查 MyBatis 对应的 XML 文件是否存在
  check-config-location: true
  mapper-locations: classpath:/mapper/**/*Mapper.xml
  type-aliases-package: com.xinyuow.frame.**.entity
  global-config:
    db-config:
      # 默认主键 ID 生成策略
      id-type: assign_id
      # 逻辑删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0
  configuration:
    # 开启延迟加载
    lazy-loading-enabled: true
    # 关闭激进式延迟加载
    aggressive-lazy-loading: false
    # 开启数据库下划线转 Java 驼峰
    map-underscore-to-camel-case: true
    # 查询结果包含 NULL 时也调用 Setter
    call-setters-on-nulls: true


# 业务配置信息
xinyuow:
  jwt:
    # JWT签名密钥
    secret: ${JWT_SECRET}
    # JWT签发者
    issuer: xinyuow-frame
    # JWT有效时间
    expiration: 7200s
  redis:
    app:
      jwt:
        # JWT会话键 - 手机号码+JTI
        session-key: "xinyuow-frame:app:jwt:%s:%s"
        # JWT所有会话键
        session-all-key: "xinyuow-frame:app:jwt:*"
        # JWT索引键 - 手机号码
        index-key: "xinyuow-frame:app:index:%s"
        # JWT所有索引键
        index-all-key: "xinyuow-frame:app:index:*"
        # JWT过期时间, 默认2小时
        expiration: 2h
  web:
    login:
      captcha:
        width: 120
        height: 40
        codeCount: 4
        lineCount: 50
        redis-key: "xinyuow-frame:web:login:captcha:%s"
        redis-expiration: 5m
    user:
      # 初始登录失败次数
      init-fail-count: 0
      # 最大登录失败次数
      max-fail-count: 5
      # 锁定时间，单位：分钟
      lock-time: 10m
